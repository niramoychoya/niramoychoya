    :root{
      --green:#11834a;
      --green-dark:#0b6238;
      --dark:#103b2b;
      --light:#eef9f2;
      --text:#17241e;
      --muted:#69766f;
      --border:#e2ece6;
      --white:#ffffff;
      --shadow:0 15px 40px rgba(16,59,43,.10);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{

      font-family:"Hind Siliguri",sans-serif;

    a{

    .topbar{

    }


    /* HEADER */

    header{

      background:rgba(255,255,255,.96);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
    }

      margin:auto;
      padding:13px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;

    }

    .brand{
      display:flex;

      gap:10px;
